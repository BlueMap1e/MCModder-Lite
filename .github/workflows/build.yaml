name: Build

# 触发语义（2026-11-21 设计，理由在案）：
# - push 只在触碰代码/构建相关路径时触发——本仓库的 smoke 是真站端到端测试，失败
#   是非确定性的（数据中心 IP 会被 mcmod.cn 限流/断连），每次 push 必跑会让
#   docs/注释类提交也撞限流，产生纯假红（2026-11-20 三连红实证：三 attempt 失败点
#   互不相同且全在导航/等待层，与代码零因果）。真回归的拦截由 verify + build
#   （确定性、快）承担。
# - schedule 每周跑一次全量 smoke：站点兼容性监控哨（本仓库无单元测试，smoke 是
#   唯一的自动化行为验证；它的正确频率 = 站点改版频率，不是提交频率）。
# - workflow_dispatch 手动全量（Actions 页面可点），不发版。
on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "eslint.config.ts"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "prettier.config.ts"
      - "lint-staged.config.ts"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0" # 每周一 UTC 21:00（北京周一 05:00）

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  smoke-public:
    # 公共页 smoke：把构建产物注入真实 mcmod.cn 页面（无需登录态与密钥）。
    # 站点对数据中心来源可能弹「安全验证」，此时 smoke 按 SKIPPED 退出（不判失败），
    # 详见 scripts/smoke-public.mjs。编辑页 E2E 依赖登录态，仍留在本地 harness。
    # ubuntu-latest 已滚到 26.04，Playwright 1.60 尚不支持其系统依赖安装，故钉在 24.04
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public-page smoke
        run: node scripts/smoke-public.mjs
  smoke-security:
    # XSS 回归：把 payload 作为页面文本注入后再跑脚本，断言不生成标签、不执行。
    # 与公共页 smoke 同样按 SKIPPED 处理站点人机验证（见 scripts/security-smoke.mjs），
    # 真实断言失败才会让 job 变红，因此可以进 CI 并作为发版前置。
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run security smoke
        run: node scripts/security-smoke.mjs
  release:
    runs-on: ubuntu-latest
    needs: [build, smoke-public, smoke-security]
    # 只在 main 的 push 上发版：schedule/workflow_dispatch 触发的监控哨 run 不发版
    #（head_commit 为 null，条件显式排除）；任意分支的 [release] 提交都不该创建 release / 打 tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: |
          VERSION=$(jq -r .version package.json)
          TAG="v$VERSION"
          IS_NEW_VERSION="true"
          if [ -n "$(git ls-remote --tags origin refs/tags/$TAG)" ]; then
            IS_NEW_VERSION="false"
            counter=1
            while [ -n "$(git ls-remote --tags origin refs/tags/${TAG}_${counter})" ]; do
              counter=$((counter + 1))
            done
            TAG="${TAG}_${counter}"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IS_NEW_VERSION=$IS_NEW_VERSION" >> $GITHUB_ENV

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          TAG_NAME: ${{ env.TAG_NAME }}
          IS_NEW_VERSION: ${{ env.IS_NEW_VERSION }}
          TARGET_SHA: ${{ github.sha }}
        run: node .github/workflows/release.cjs
