name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  smoke-public:
    # 公共页 smoke：把构建产物注入真实 mcmod.cn 页面（无需登录态与密钥）。
    # 站点对数据中心来源可能弹「安全验证」，此时 smoke 按 SKIPPED 退出（不判失败），
    # 详见 scripts/smoke-public.mjs。编辑页 E2E 依赖登录态，仍留在本地 harness。
    # ubuntu-latest 已滚到 26.04，Playwright 1.60 尚不支持其系统依赖安装，故钉在 24.04
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public-page smoke
        run: node scripts/smoke-public.mjs
  smoke-security:
    # XSS 回归：把 payload 作为页面文本注入后再跑脚本，断言不生成标签、不执行。
    # 与公共页 smoke 同样按 SKIPPED 处理站点人机验证（见 scripts/security-smoke.mjs），
    # 真实断言失败才会让 job 变红，因此可以进 CI 并作为发版前置。
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run security smoke
        run: node scripts/security-smoke.mjs
  release:
    runs-on: ubuntu-latest
    needs: [build, smoke-public, smoke-security]
    # 只在 main 上发版：任意分支的 [release] 提交都不该创建 release / 打 tag
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: |
          VERSION=$(jq -r .version package.json)
          TAG="v$VERSION"
          IS_NEW_VERSION="true"
          if [ -n "$(git ls-remote --tags origin refs/tags/$TAG)" ]; then
            IS_NEW_VERSION="false"
            counter=1
            while [ -n "$(git ls-remote --tags origin refs/tags/${TAG}_${counter})" ]; do
              counter=$((counter + 1))
            done
            TAG="${TAG}_${counter}"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IS_NEW_VERSION=$IS_NEW_VERSION" >> $GITHUB_ENV

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          TAG_NAME: ${{ env.TAG_NAME }}
          IS_NEW_VERSION: ${{ env.IS_NEW_VERSION }}
          TARGET_SHA: ${{ github.sha }}
        run: node .github/workflows/release.cjs
